name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/mercedes-benz-models-site-7cig85]
  workflow_dispatch:

# Least privilege the deploy needs: read the tree, publish Pages, and mint the
# OIDC token deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No enablement: true here. Creating a Pages site is not available to the
      # Actions token ("Resource not accessible by integration"), and asking for
      # it fails the whole job. Pages must be switched on once by the repository
      # owner: Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      # The site is plain static files at the repo root — nothing to build.
      # Photographs are not committed; models without one fall back to their
      # SVG silhouette, so the deployed site is complete either way.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
