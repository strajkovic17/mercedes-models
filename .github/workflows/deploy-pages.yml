name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/mercedes-benz-models-site-7cig85]
  workflow_dispatch:

# Least privilege the deploy needs: read the tree, publish Pages, and mint the
# OIDC token deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on via the API, so the repository does not
      # need the switch flipped by hand in Settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files at the repo root — nothing to build.
      # Photographs are not committed; models without one fall back to their
      # SVG silhouette, so the deployed site is complete either way.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
